version: '3.8'

services:
  beatrice-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: beatrice-assistant-bot:latest
    container_name: beatrice_assistant_bot
    restart: always

    # Konfigurasi Variabel Lingkungan & API Key (Ditanam langsung agar tidak tergantung file .env saat deploy di VPS)
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1
      - DISCORD_TOKEN=MTUyMDI4MTg1ODkxNzY2Mjc1MA.GngSjS.KI-cSHHDL2MZtZl8BtDvxK3eGmnTYRrHDVnXZM
      - DISCORD_USER_ID=1177248485733568543
      - GEMINI_API_KEY=AIzaSyCQukY9CIDe7moHRzwcRp8usKTf0fiVRGM
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password
      - IMAP_SERVER=imap.gmail.com
      - SMTP_SERVER=smtp.gmail.com
      - RESEND_API_KEY=re_GHTALCbY_Pmc3VP2P5f7niDE11NzWbTY4
      - RESEND_EMAIL_KEVIN_HARLY=re_GHTALCbY_Pmc3VP2P5f7niDE11NzWbTY4
      - RESEND_SENDER_EMAIL=onboarding@resend.dev
      - FINHUB_API_KEY=d8t5luhr01qh5rf2pam0d8t5luhr01qh5rf2pamg
      - FINNHUB_API_KEY=d8t5luhr01qh5rf2pam0d8t5luhr01qh5rf2pamg

    # Penyimpanan persisten untuk log agar tidak hilang saat restart kontainer
    volumes:
      - ./logs:/app/logs

    # Pembatasan Penggunaan Sumber Daya VPS (cegah kelebihan beban memori/CPU)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

    # Rotasi log internal Docker agar tidak memenuhi hard disk VPS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Isolasi Jaringan Khusus
    networks:
      - beatrice-network

networks:
  beatrice-network:
    name: beatrice_vps_net
    driver: bridge
